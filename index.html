<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>員工考勤 | 出勤・備註・自動分享・匯出 Excel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f0f4f8 0%, #d9e2ec 100%);
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .attendance-card {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15);
            padding: 2rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            color: #475569;
            margin-bottom: 1.5rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .employee-info {
            background: #f1f5f9;
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: white;
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .input-group label {
            font-weight: 600;
            color: #334155;
            min-width: 55px;
        }

        .input-group input {
            border: none;
            outline: none;
            font-size: 1rem;
            width: 100%;
            background: transparent;
            padding: 0.4rem 0;
        }

        .auto-share-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            padding: 0.2rem 0;
        }

        .auto-share-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #25D366;
            cursor: pointer;
        }

        .auto-share-option label {
            font-weight: 500;
            color: #334155;
            cursor: pointer;
        }

        .current-info {
            background: #f1f5f9;
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .date-text {
            font-weight: 700;
            font-size: 1.2rem;
        }
        .time-text {
            font-weight: 700;
            font-size: 1.8rem;
        }

        .location-badge {
            background: white;
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: default;
        }

        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .attendance-btn {
            border: none;
            padding: 1.2rem;
            border-radius: 2rem;
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }

        .btn-start { background: #10b981; }
        .btn-end { background: #ef4444; }
        .btn-outwork { background: #f59e0b; }

        .attendance-btn:active { transform: scale(0.97); }

        .action-row {
            display: flex;
            gap: 0.8rem;
            margin: 0.8rem 0 0.5rem;
        }

        .export-btn, .whatsapp-btn {
            flex: 1;
            color: white;
            border: none;
            padding: 0.8rem 0.5rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
        }

        .export-btn { background: #3b82f6; }
        .whatsapp-btn { background: #25D366; }

        .record-panel {
            background: #f8fafc;
            border-radius: 1.5rem;
            padding: 1rem;
            margin-top: 1rem;
        }

        .log-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .log-item {
            background: white;
            padding: 0.7rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
        }

        .log-action {
            font-weight: 700;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.7rem;
        }

        .action-start { background: #d1fae5; color: #065f46; }
        .action-end { background: #fee2e2; color: #991b1b; }
        .action-outwork { background: #fef3c7; color: #92400e; }

        .status-message {
            margin-top: 0.8rem;
            font-size: 0.9rem;
            color: #2563eb;
            text-align: center;
            min-height: 22px;
        }

        .danger-btn {
            background: transparent;
            border: 1px solid #cbd5e1;
            color: #64748b;
            padding: 0.5rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            margin-top: 0.5rem;
        }

        .remark-input {
            background: white;
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .remark-input label {
            font-weight: 600;
            color: #334155;
            white-space: nowrap;
        }
        .remark-input input {
            border: none;
            outline: none;
            font-size: 1rem;
            width: 100%;
            background: transparent;
            padding: 0.4rem 0;
        }
    </style>
</head>
<body>
<div class="attendance-card">
    <h1>📋 員工考勤</h1>
    <div class="subtitle">📌 填寫資料・打卡自動分享・備註出勤地點</div>

    <!-- 員工資料輸入 -->
    <div class="employee-info">
        <div class="input-group">
            <label>👤 姓名</label>
            <input type="text" id="employeeName" placeholder="輸入姓名" autocomplete="name">
        </div>
        <div class="input-group">
            <label>📞 電話</label>
            <input type="tel" id="employeePhone" placeholder="輸入電話號碼" autocomplete="tel">
        </div>
        <div class="remark-input">
            <label>📝 備註</label>
            <input type="text" id="remarkInput" placeholder="例：XX公司開會 / 外出拜訪客戶" autocomplete="off">
        </div>
    </div>

    <!-- 自動分享選項 -->
    <div class="auto-share-option">
        <input type="checkbox" id="autoShareCheckbox" checked>
        <label for="autoShareCheckbox">📲 打卡後自動分享到 WhatsApp</label>
    </div>

    <!-- 日期時間位置 -->
    <div class="current-info">
        <div>
            <div class="date-text" id="displayDate">--</div>
            <div class="time-text" id="displayTime">--:--</div>
        </div>
        <div class="location-badge" id="locationDisplay" title="點擊查看完整地址">⏳ 定位中...</div>
    </div>

    <!-- 打卡按鈕 -->
    <div class="button-grid">
        <button class="attendance-btn btn-start" id="btnStart">🔵 上班</button>
        <button class="attendance-btn btn-end" id="btnEnd">🔴 下班</button>
        <button class="attendance-btn btn-outwork" id="btnOutwork">🟠 出勤</button>
    </div>

    <!-- 手動分享與匯出按鈕 -->
    <div class="action-row">
        <button class="whatsapp-btn" id="btnShareWhatsApp">📲 分享最後記錄</button>
        <button class="export-btn" id="btnExport">📥 匯出 Excel</button>
    </div>

    <!-- 記錄列表 -->
    <div class="record-panel">
        <div style="font-weight:700; margin-bottom:0.5rem;">🕒 最近打卡記錄</div>
        <ul class="log-list" id="logContainer">
            <li style="color:#94a3b8; text-align:center;">尚無記錄</li>
        </ul>
    </div>
   
    <button class="danger-btn" id="btnClearLogs">🗑️ 清除所有記錄</button>
    <div class="status-message" id="statusMessage"></div>
</div>

<script>
    (function() {
        const nameInput = document.getElementById('employeeName');
        const phoneInput = document.getElementById('employeePhone');
        const remarkInput = document.getElementById('remarkInput');
        const displayDate = document.getElementById('displayDate');
        const displayTime = document.getElementById('displayTime');
        const locationDisplay = document.getElementById('locationDisplay');
        const btnStart = document.getElementById('btnStart');
        const btnEnd = document.getElementById('btnEnd');
        const btnOutwork = document.getElementById('btnOutwork');
        const btnExport = document.getElementById('btnExport');
        const btnShareWhatsApp = document.getElementById('btnShareWhatsApp');
        const btnClear = document.getElementById('btnClearLogs');
        const logContainer = document.getElementById('logContainer');
        const statusMessage = document.getElementById('statusMessage');
        const autoShareCheckbox = document.getElementById('autoShareCheckbox');

        const STORAGE_KEY = 'emp_attendance_v3';
        const PROFILE_KEY = 'emp_profile';
        let attendanceLogs = [];
        let currentPosition = { latitude: null, longitude: null, address: null, error: null };

        // 載入/儲存記錄
        function loadLogs() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                attendanceLogs = saved ? JSON.parse(saved) : [];
            } catch(e) { attendanceLogs = []; }
        }
        function saveLogs() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(attendanceLogs));
        }

        // 載入/儲存員工資料及備註（備註唔會自動儲存，避免殘留，但可以按需要儲存）
        function loadProfile() {
            try {
                const p = localStorage.getItem(PROFILE_KEY);
                if (p) {
                    const profile = JSON.parse(p);
                    if (profile.name) nameInput.value = profile.name;
                    if (profile.phone) phoneInput.value = profile.phone;
                }
            } catch(e){}
        }
        function saveProfile() {
            localStorage.setItem(PROFILE_KEY, JSON.stringify({
                name: nameInput.value.trim(),
                phone: phoneInput.value.trim()
            }));
        }
        nameInput.addEventListener('input', saveProfile);
        phoneInput.addEventListener('input', saveProfile);

        function getEmployeeInfo() {
            return {
                name: nameInput.value.trim(),
                phone: phoneInput.value.trim(),
                remark: remarkInput.value.trim()
            };
        }

        function validateEmployee() {
            const {name, phone} = getEmployeeInfo();
            if (!name) { statusMessage.textContent = '⚠️ 請輸入員工姓名'; return false; }
            if (!phone || !/^\d{7,11}$/.test(phone)) {
                statusMessage.textContent = '⚠️ 請輸入有效電話號碼 (7-11位數字)';
                return false;
            }
            return true;
        }

        function renderLogs() {
            if (attendanceLogs.length === 0) {
                logContainer.innerHTML = '<li style="color:#94a3b8; text-align:center;">尚無記錄</li>';
                return;
            }
            const recent = [...attendanceLogs].reverse().slice(0, 5);
            logContainer.innerHTML = recent.map(log => {
                let actionClass = '';
                if (log.type === '上班') actionClass = 'action-start';
                else if (log.type === '下班') actionClass = 'action-end';
                else if (log.type === '出勤') actionClass = 'action-outwork';
                return `
                    <li class="log-item" title="完整地址：${log.location || ''}&#10;備註：${log.remark || ''}">
                        <span class="log-action ${actionClass}">${log.type}</span>
                        <span style="font-weight:500;">${log.employeeName || ''}</span>
                        <span style="font-size:0.7rem;">${log.timestamp || ''}</span>
                        <span style="font-size:0.65rem; color:#64748b;">📞${log.employeePhone || ''}</span>
                        ${log.remark ? `<span style="font-size:0.65rem; color:#475569; width:100%;">📝${log.remark}</span>` : ''}
                    </li>
                `;
            }).join('');
        }

        function updateDateTime() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth()+1).padStart(2,'0');
            const d = String(now.getDate()).padStart(2,'0');
            const w = ['日','一','二','三','四','五','六'][now.getDay()];
            displayDate.textContent = `${y}-${m}-${d} 星期${w}`;
            displayTime.textContent = now.toTimeString().split(' ')[0];
        }

        function getTimestamp() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${now.toTimeString().split(' ')[0]}`;
        }

        function getLocationStr() {
            if (currentPosition.address) return currentPosition.address;
            if (currentPosition.latitude) return `${currentPosition.latitude.toFixed(4)},${currentPosition.longitude.toFixed(4)}`;
            if (currentPosition.error) return `定位失敗(${currentPosition.error})`;
            return '定位中';
        }

        function updateLocationDisplay() {
            const fullAddress = getLocationStr();
            locationDisplay.textContent = fullAddress.length > 25 ? fullAddress.substring(0, 22) + '…' : fullAddress;
            locationDisplay.title = fullAddress;
        }

        function requestLocation() {
            if (!navigator.geolocation) {
                currentPosition.error = '不支援';
                updateLocationDisplay();
                return;
            }
            statusMessage.textContent = '📍 正在獲取詳細地址...';
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentPosition.latitude = pos.coords.latitude;
                    currentPosition.longitude = pos.coords.longitude;
                    currentPosition.error = null;
                    fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&accept-language=zh-HK`, {
                        headers: {
                            'User-Agent': 'EmployeeAttendanceApp/1.0 (your-email@example.com)'
                        }
                    })
                    .then(r => r.json())
                    .then(data => {
                        if (data && data.display_name) {
                            currentPosition.address = data.display_name;
                        } else {
                            currentPosition.address = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
                        }
                        updateLocationDisplay();
                        statusMessage.textContent = '✅ 詳細地址已更新';
                    })
                    .catch(() => {
                        currentPosition.address = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
                        updateLocationDisplay();
                        statusMessage.textContent = '⚠️ 無法獲取地址，使用經緯度';
                    });
                },
                (err) => {
                    currentPosition.error = '拒絕/失敗';
                    updateLocationDisplay();
                    statusMessage.textContent = '⚠️ 定位失敗，請允許位置權限';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // 生成分享訊息（包含備註）
        function generateShareMessage(record) {
            let msg = `📋 員工打卡通知\n👤 姓名：${record.employeeName}\n📞 電話：${record.employeePhone}\n🏷️ 類型：${record.type}\n🕒 時間：${record.timestamp}\n📍 地點：${record.location}`;
            if (record.remark) {
                msg += `\n📝 備註：${record.remark}`;
            }
            return msg;
        }

        function shareRecord(record) {
            const message = generateShareMessage(record);
            const encodedMessage = encodeURIComponent(message);

            if (navigator.share) {
                navigator.share({
                    title: '員工打卡通知',
                    text: message,
                }).then(() => {
                    statusMessage.textContent = '✅ 分享選單已打開，請選擇 WhatsApp 群組';
                }).catch((error) => {
                    console.log('分享失敗', error);
                    fallbackToWhatsAppWeb(encodedMessage);
                });
            } else {
                fallbackToWhatsAppWeb(encodedMessage);
            }
        }

        function fallbackToWhatsAppWeb(encodedMessage) {
            const url = `https://wa.me/?text=${encodedMessage}`;
            const newWindow = window.open(url, '_blank');
            if (!newWindow) {
                statusMessage.textContent = '⚠️ 請允許彈出視窗，或訊息已複製到剪貼簿';
                copyMessageToClipboard(decodeURIComponent(encodedMessage));
            } else {
                statusMessage.textContent = '📲 已打開 WhatsApp，請選擇群組發送';
            }
        }

        function copyMessageToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                statusMessage.textContent = '📋 訊息已複製到剪貼簿，請貼上到 WhatsApp 群組';
            }).catch(() => {
                statusMessage.textContent = '⚠️ 無法複製，請手動複製訊息';
            });
        }

        // 打卡
        function addRecord(type) {
            if (!validateEmployee()) return;
            const {name, phone, remark} = getEmployeeInfo();
            const record = {
                id: Date.now(),
                type,
                timestamp: getTimestamp(),
                location: getLocationStr(),
                employeeName: name,
                employeePhone: phone,
                remark: remark,
                lat: currentPosition.latitude,
                lng: currentPosition.longitude
            };
            attendanceLogs.push(record);
            saveLogs();
            renderLogs();
            statusMessage.textContent = `✅ ${name} ${type} 打卡成功`;

            if (autoShareCheckbox.checked) {
                setTimeout(() => {
                    shareRecord(record);
                }, 300);
            }

            // 打卡後可選擇清空備註欄（預設保留，方便連續出勤唔使重打）
            // remarkInput.value = ''; // 如果想自動清空可以取消註解
        }

        function shareLastRecord() {
            if (attendanceLogs.length === 0) {
                statusMessage.textContent = '⚠️ 沒有任何打卡記錄可以分享';
                return;
            }
            shareRecord(attendanceLogs[attendanceLogs.length - 1]);
        }

        function exportToCSV() {
            if (attendanceLogs.length === 0) {
                statusMessage.textContent = '⚠️ 沒有任何記錄可以匯出';
                return;
            }
            const headers = ['姓名', '電話', '打卡類型', '時間', '詳細地址', '備註', '緯度', '經度'];
            const rows = attendanceLogs.map(log => [
                log.employeeName || '',
                log.employeePhone || '',
                log.type || '',
                log.timestamp || '',
                log.location || '',
                log.remark || '',
                log.lat || '',
                log.lng || ''
            ]);
           
            const csvContent = [headers, ...rows].map(row =>
                row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(',')
            ).join('\n');
           
            const blob = new Blob(['\uFEFF' + csvContent], {type: 'text/csv;charset=utf-8;'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `員工考勤記錄_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(url);
            statusMessage.textContent = '📥 匯出成功！詳細地址及備註已在 Excel 中';
        }

        function clearAllLogs() {
            if (confirm('確定要清除所有打卡記錄嗎？呢個動作無法復原！')) {
                attendanceLogs = [];
                saveLogs();
                renderLogs();
                statusMessage.textContent = '🗑️ 所有記錄已清除';
            }
        }

        // 綁定事件
        btnStart.addEventListener('click', () => addRecord('上班'));
        btnEnd.addEventListener('click', () => addRecord('下班'));
        btnOutwork.addEventListener('click', () => addRecord('出勤'));
        btnExport.addEventListener('click', exportToCSV);
        btnShareWhatsApp.addEventListener('click', shareLastRecord);
        btnClear.addEventListener('click', clearAllLogs);

        // 初始化
        loadLogs();
        loadProfile();
        renderLogs();
        updateDateTime();
        setInterval(updateDateTime, 1000);
        requestLocation();
        setInterval(requestLocation, 300000);
        statusMessage.textContent = '✅ 已準備好，打卡後會自動分享（含備註）';
    })();
</script>
</body>
</html>
